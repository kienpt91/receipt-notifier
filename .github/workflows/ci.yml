name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # Same Postgres/Redis/Kafka as local dev: tests run against the real things.
      - name: Start infrastructure
        run: docker compose up -d
      # Kafka is probed from the host, the way the tests connect. An in-container probe
      # follows the advertised listener (localhost:59092), which only exists on the host.
      - name: Wait for Postgres, Redis and Kafka
        timeout-minutes: 3
        run: |
          until timeout 10 docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done
          until timeout 5 docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 1; done
          until timeout 20 node -e "
            const { Kafka, logLevel } = require('kafkajs');
            const admin = new Kafka({ brokers: ['localhost:59092'], logLevel: logLevel.NOTHING, retry: { retries: 0 } }).admin();
            admin.connect().then(() => admin.listTopics()).then(() => process.exit(0), () => process.exit(1));
          "; do
            echo "waiting for kafka"; sleep 2
          done
      - run: npm test
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --tail 100

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/secret-scan.sh --tree
      - run: sh scripts/secret-scan.sh --history
